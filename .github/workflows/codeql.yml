name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # deploy/** holds esbuild output committed for deployment; it duplicates
          # source files that CodeQL already analyzes, so scanning it only adds noise.
          config: |
            paths-ignore:
              - deploy/**
              - "**/dist/**"
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
