# DeepSeek integration config for the Codex CLI (inside the image at /opt/platform/codex/config.toml).
#
# The DeepSeek API natively implements the OpenAI Responses API, and Codex 0.164+ only supports the responses
# protocol (the old wire_api = "chat" has been removed), so responses is used here.
# The key is not written into the file: it is provided by the container environment variable DEEPSEEK_API_KEY and explicitly
# allowed to the CLI via the Profile's --pass-env DEEPSEEK_API_KEY.

model = "deepseek-flash"
model_provider = "deepseek"
forced_login_method = "api"
model_reasoning_effort = "high"
suppress_unstable_features_warning = true

[model_providers.deepseek]
name = "deepseek"
base_url = "https://api.deepseek.com/"
wire_api = "responses"
env_key = "DEEPSEEK_API_KEY"
