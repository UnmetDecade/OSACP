# Same-origin proxy for the demo UI. Mirrors the Vite dev proxy so the browser
# only ever talks to this origin; PCS and the scheduler are never exposed to the
# page. Authentication uses the PCS session cookie, which passes through nginx
# unchanged; no shared admin token is injected here.

map $http_upgrade $demo_connection {
  default upgrade;
  ""      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # PCS: accounts, hosts, profiles, audit, terminal WebSocket.
  location /api/pcs/ {
    proxy_pass http://pcs:7901/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $demo_connection;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Legacy prefix kept by older saved connections.
  location /pcs/ {
    proxy_pass http://pcs:7901/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $demo_connection;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Scheduler: tasks, leases, events stream.
  location /api/scheduler/ {
    proxy_pass http://scheduler:8443/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $demo_connection;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA routes fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
